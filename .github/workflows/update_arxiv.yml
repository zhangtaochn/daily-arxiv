name: Update Arxiv Papers
on:
  schedule:
    - cron: '0 20 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-arxiv-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pipeline
        env:
          API_KEY: ${{ secrets.API_KEY }}
          BASE_URL: ${{ vars.BASE_URL }}
          MODEL: ${{ vars.MODEL }}
          TOP_N: ${{ vars.TOP_N }}
          KEYWORDS: ${{ vars.KEYWORDS }}
          MAX_WORKERS: ${{ vars.MAX_WORKERS }}
        run: |
          python run.py run_pipeline

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Commit all web artifacts needed for GitHub Pages
          git add web/all_papers.json web/manifest.json web/recent.json 2>/dev/null || true
          git add -A web/by_date 2>/dev/null || true
          git commit -m "Update papers data and web artifacts" || echo "No changes to commit"
          git push
