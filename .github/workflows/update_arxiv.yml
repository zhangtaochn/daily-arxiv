name: Update arxiv papers
on:
  schedule:
    - cron: '0 20 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-arxiv-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
  
      - name: Run pipeline
        env:
          API_KEY: ${{ secrets.API_KEY }}
          BASE_URL: ${{ vars.BASE_URL }}
          MODEL: ${{ vars.MODEL }}
          TOP_N: ${{ vars.TOP_N }}
          KEYWORDS: ${{ vars.KEYWORDS }}
          MAX_WORKERS: ${{ vars.MAX_WORKERS }}
        run: |
          python run.py run_pipeline

      - name: Commit changes
        run: |
          git config user.name "zhangtaochn"
          git config user.email "zhangtao-1994@qq.com"
          git add web/all_papers.json data/*
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "Arxiv Papers Update"
          fi

      - name: Push changes
        if: ${{ !cancelled() }}
        env:
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
        run: |
          git config user.name "zhangtaochn"
          git config user.email "zhangtao-1994@qq.com"
          git remote set-url origin https://zhangtaochn:${ACCESS_TOKEN}@github.com/zhangtaochn/daily-arxiv.git
          if git diff --quiet HEAD -- web/all_papers.json data; then
            echo "No changes to push"
          else
            git push origin HEAD:main
          fi
